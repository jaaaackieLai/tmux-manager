name: Rust 與 tmux 行為驗證
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: 安裝 tmux（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: 安裝 tmux（macOS）
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: 真實 tmux/PTY（必須執行，不以 skip 當成通過）
        run: cargo test --locked --test tmux_pty --test tmux_capture -- --ignored --nocapture
      - name: install.sh 測試
        run: ./tests/bats/bin/bats tests/
