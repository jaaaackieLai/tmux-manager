name: 發布 v2 release
# 建置各平台 binary 並建立 GitHub Release。正常流程是 PR 合併後從 main 手動觸發：
# 依 Cargo.toml 版本在觸發的 commit 建立 v<version> tag。推送 v* tag 也會觸發（tag 須與版本一致）。
# 其他分支手動觸發只建置不發布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: 安裝 musl 工具鏈（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 建置
        shell: bash
        run: |
          # ring 含 C 程式碼；明確指定 musl-gcc，避免 cc crate 找不到 <arch>-linux-musl-gcc。
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            export "CC_$(tr - _ <<< "${{ matrix.target }}")=musl-gcc"
          fi
          cargo build --release --locked --target ${{ matrix.target }}
      - name: 確認 binary 可執行（Linux 須為靜態連結，不依賴 glibc 版本）
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/tmux-manager
          "$binary" --version
          if [[ "$RUNNER_OS" == Linux ]] && ldd "$binary" 2>&1 | grep -q 'libc.so'; then
            echo "Linux binary 動態連結 glibc" >&2
            exit 1
          fi
      - name: 產生 binary 與 SHA-256
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/tmux-manager artifacts/tmux-manager-${{ matrix.target }}
          cd artifacts
          if command -v sha256sum >/dev/null; then
            sha256sum tmux-manager-${{ matrix.target }} > tmux-manager-${{ matrix.target }}.sha256
          else
            shasum -a 256 tmux-manager-${{ matrix.target }} > tmux-manager-${{ matrix.target }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tmux-manager-${{ matrix.target }}
          path: artifacts/*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 決定 tag（須與 Cargo 版本一致）
        id: tag
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag ${GITHUB_REF_NAME} 與 Cargo 版本 ${version} 不符" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 建立 GitHub Release，已存在則補傳 binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 既有 tag 必須指向本次建置的 commit；否則是忘了 bump 版本，不能覆蓋舊版的 binary。
          if sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)" \
            && [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "${TAG} 已指向 ${sha}，不是本次建置的 ${GITHUB_SHA}；請先 bump 版本" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
